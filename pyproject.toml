[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The PyPI name `cairn` is taken by an unrelated 2019 project, so the
# distribution is `cairn-maps`. Since 2026-10 this is the conversion ENGINE
# only -- the web app (web/) is the sole interface. The typer CLI and Textual
# TUI were removed; their last state is git tag `cli-final`.
name = "cairn-maps"
version = "1.0.0"
description = "Migrate map data between OnX Backcountry and CalTopo"
readme = "README.md"
requires-python = ">=3.10"  # cairn/model.py:119 uses a runtime PEP 604 union
license = {text = "MIT"}
authors = [
    {name = "Scott"}
]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    # tests/web/test_web_app.py drives the Pyodide prototype in a real browser.
    # After sync, browsers must exist once per machine: `uv run playwright install chromium`
    "playwright>=1.40",
]

[tool.hatch.build.targets.wheel]
packages = ["cairn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=cairn --cov-report=term-missing"
