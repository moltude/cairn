# Publishes to PyPI on a version tag, using Trusted Publishing (OIDC) — no API
# tokens stored anywhere.
#
# ONE-TIME SETUP before the first tag:
#   1. https://pypi.org/manage/account/publishing/ -> add a *pending* publisher
#        PyPI project name: cairn-maps
#        Owner: moltude        Repository: cairn
#        Workflow filename: release.yml   <- must match THIS file's name
#        Environment: pypi
#   2. Create a `pypi` environment in the repo settings and require manual
#      approval on it (PyPA recommends this; it is the last gate before an
#      immutable upload).
#
# A pending publisher does not reserve the name — it claims `cairn-maps` on the
# first successful publish. If someone registers it first, the publisher is
# invalidated.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # setup-uv v10 disables caching on tag-push events anyway; be explicit
          # so nobody "fixes" this later.
          enable-cache: false

      # pyproject.toml carries the version by hand and PyPI filenames are
      # IMMUTABLE — publishing a wrong version once is permanent. Fail loudly
      # instead.
      - name: Verify tag matches pyproject version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          proj="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$tag pyproject=$proj"
          [ "$tag" = "$proj" ] || { echo "::error::tag $tag != pyproject version $proj"; exit 1; }

      - name: Build
        run: uv build --no-sources

      # Prove the artifact actually runs before it becomes permanent.
      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl -- cairn --help
      - name: Smoke test (sdist)
        run: uv run --isolated --no-project --with dist/*.tar.gz -- cairn --help

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cairn-maps
    permissions:
      id-token: write # MANDATORY for trusted publishing; set in NO other job
    steps:
      - name: Download dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      # No credentials. PEP 740 attestations are generated and uploaded by
      # default (>= v1.11.0) using this job's OIDC identity.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: GitHub Release
    needs: [publish-to-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release
    steps:
      - name: Download dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Create release and attach dists
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'a') || contains(github.ref_name, 'b') }}
